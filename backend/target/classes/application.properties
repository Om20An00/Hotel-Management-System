spring.datasource.url=jdbc:derby:memory:hotel_db;create=true
spring.datasource.driver-class-name=org.apache.derby.jdbc.EmbeddedDriver
spring.datasource.username=
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.jpa.database-platform=org.hibernate.dialect.DerbyDialect
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
app.jwt.secret=HotelManagementSecretKeyForJWTTokenGenerationWhichIsLongEnough2024
app.jwt.expiration=86400000
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
