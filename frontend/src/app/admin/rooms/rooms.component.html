<!-- =========================
     ROOM MANAGEMENT CONTENT
     ========================= -->

<div class="d-flex justify-content-between align-items-center mb-3">
  <!-- Back to Dashboard Button -->
<button
  class="btn btn-outline-primary mb-3"
  routerLink="/admin/dashboard">
  <i class="bi bi-speedometer2 me-1"></i>
  Dashboard
</button>
  <h3>
    <i class="bi bi-door-open me-2 text-primary"></i>
    Room Management
  </h3>

  <div class="d-flex gap-2">
    <button class="btn btn-primary"
            (click)="showAdd=!showAdd; showEdit=false">
      <i class="bi bi-plus-circle me-1"></i> Add Room
    </button>

    <button class="btn btn-outline-secondary"
            (click)="downloadTemplate()">
      <i class="bi bi-download me-1"></i> CSV Template
    </button>
  </div>
</div>

<!-- Alerts -->
<div *ngIf="success" class="alert alert-success alert-dismissible">
  {{ success }}
  <button class="btn-close" (click)="success=''"></button>
</div>

<div *ngIf="error" class="alert alert-danger alert-dismissible">
  {{ error }}
  <button class="btn-close" (click)="error=''"></button>
</div>

<!-- ADD ROOM -->
<div class="card shadow-sm mb-3" *ngIf="showAdd">
  <div class="card-header bg-primary text-white">
    Add New Room
  </div>

  <div class="card-body">
    <div class="row g-3">

      <div class="col-md-3">
        <label class="form-label">Room Number *</label>
        <input [(ngModel)]="newRoom.roomNumber"
               class="form-control"
               maxlength="6">
      </div>

      <div class="col-md-3">
        <label class="form-label">Room Type *</label>
        <select [(ngModel)]="newRoom.roomType" class="form-select">
          <option value="">Select</option>
          <option value="STANDARD">Standard</option>
          <option value="DELUXE">Deluxe</option>
          <option value="SUITE">Suite</option>
          <option value="SUPREME">Supreme</option>
        </select>
      </div>

      <div class="col-md-3">
        <label class="form-label">Bed Type</label>
        <select [(ngModel)]="newRoom.bedType" class="form-select">
          <option value="">Select</option>
          <option value="SINGLE">Single</option>
          <option value="DOUBLE">Double</option>
          <option value="QUEEN">Queen</option>
          <option value="KING">King</option>
        </select>
      </div>

      <div class="col-md-3">
        <label class="form-label">Price / Night *</label>
        <input [(ngModel)]="newRoom.pricePerNight"
               type="number"
               class="form-control">
      </div>

      <div class="col-md-3">
        <label class="form-label">Max Occupancy *</label>
        <input [(ngModel)]="newRoom.maxOccupancy"
               type="number"
               class="form-control"
               min="1">
      </div>

      <div class="col-md-3">
        <label class="form-label">Room Size (sqft)</label>
        <input [(ngModel)]="newRoom.roomSize"
               type="number"
               class="form-control">
      </div>

      <div class="col-md-3">
        <label class="form-label">Status *</label>
        <select [(ngModel)]="newRoom.status" class="form-select">
          <option value="AVAILABLE">Available</option>
          <option value="UNDER_MAINTENANCE">Under Maintenance</option>
        </select>
      </div>

      <div class="col-md-3">
        <label class="form-label">Add Amenity</label>
        <div class="input-group">
          <input [(ngModel)]="amenityInput"
                 class="form-control"
                 placeholder="WiFi, AC...">
          <button class="btn btn-outline-secondary"
                  (click)="addAmenity()">
            <i class="bi bi-plus"></i>
          </button>
        </div>

        <div class="mt-1">
          <span *ngFor="let a of newRoom.amenities; let i=index"
                class="badge bg-secondary me-1">
            {{ a }}
            <span class="ms-1"
                  style="cursor:pointer"
                  (click)="removeAmenity(newRoom.amenities, i)">×</span>
          </span>
        </div>
      </div>

      <div class="col-12">
        <label class="form-label">Description</label>
        <textarea [(ngModel)]="newRoom.description"
                  class="form-control"
                  rows="2"></textarea>
      </div>
    </div>

    <button class="btn btn-primary mt-3"
            (click)="submitAdd()">
      Save Room
    </button>
  </div>
</div>

<!-- ROOM TABLE -->
<div class="table-responsive" *ngIf="!loading">
  <table class="table table-hover table-bordered align-middle">
    <thead class="table-dark">
      <tr>
        <th>Room #</th>
        <th>Type</th>
        <th>Price</th>
        <th>Status</th>
        <th>Max Occ.</th>
        <th>Amenities</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let r of rooms">
        <td>{{ r.roomNumber }}</td>
        <td>{{ r.roomType }}</td>
        <td>₹{{ r.pricePerNight }}</td>
        <td>
          <span class="badge"
                [class.bg-success]="r.status==='AVAILABLE'"
                [class.bg-warning]="r.status==='UNDER_MAINTENANCE'">
            {{ r.status }}
          </span>
        </td>
        <td>{{ r.maxOccupancy }}</td>
        <td class="small">{{ r.amenities?.join(', ') || '-' }}</td>
        <td>
          <button class="btn btn-sm btn-warning"
                  (click)="openEdit(r)"
                  [disabled]="r.status==='OCCUPIED'">
            <i class="bi bi-pencil"></i> Edit
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
