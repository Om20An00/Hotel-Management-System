<!-- =========================
   USER MANAGEMENT CONTENT
   ========================= -->

<div class="d-flex justify-content-between align-items-center mb-3">
  <button
  class="btn btn-outline-primary mb-3"
  routerLink="/admin/dashboard">
  <i class="bi bi-speedometer2 me-1"></i>
  Dashboard
</button>
  <h3>
    <i class="bi bi-people me-2 text-primary"></i>
    User Management
  </h3>

  <button class="btn btn-primary"
          (click)="showAdd=!showAdd; showEdit=false">
    <i class="bi bi-plus-circle me-1"></i> Add User
  </button>
</div>

<!-- Alerts -->
<div *ngIf="success" class="alert alert-success alert-dismissible">
  <span>{{ success }}</span>
  <button type="button"
          class="btn-close"
          (click)="success=''"></button>
</div>

<div *ngIf="error" class="alert alert-danger alert-dismissible">
  <span>{{ error }}</span>
  <button type="button"
          class="btn-close"
          (click)="error=''"></button>
</div>

<!-- ADD USER -->
<div class="card shadow-sm mb-3" *ngIf="showAdd">
  <div class="card-header bg-primary text-white">
    Add User
  </div>

  <div class="card-body">
    <div class="row g-3">

      <div class="col-md-4">
        <label class="form-label">Username *</label>
        <input [(ngModel)]="newUser.username"
               class="form-control">
      </div>

      <div class="col-md-4">
        <label class="form-label">Full Name *</label>
        <input [(ngModel)]="newUser.customerName"
               class="form-control">
      </div>

      <div class="col-md-4">
        <label class="form-label">Email *</label>
        <input [(ngModel)]="newUser.email"
               class="form-control">
      </div>

      <div class="col-md-4">
        <label class="form-label">Role *</label>
        <select [(ngModel)]="newUser.role"
                class="form-select">
          <option value="CUSTOMER">Customer</option>
          <option value="STAFF">Staff</option>
        </select>
      </div>

    </div>

    <div class="d-flex gap-2 mt-3">
      <button class="btn btn-primary"
              (click)="submitAdd()">
        Create User
      </button>
      <button class="btn btn-outline-secondary"
              (click)="showAdd=false">
        Cancel
      </button>
    </div>
  </div>
</div>

<!-- EDIT USER -->
<div class="card shadow-sm mb-3"
     *ngIf="showEdit && editUser">

  <div class="card-header bg-warning">
    Edit User: {{ editUser.username }}
  </div>

  <div class="card-body">
    <div class="row g-3">

      <div class="col-md-4">
        <label class="form-label">Full Name</label>
        <input [(ngModel)]="editUser.customerName"
               class="form-control">
      </div>

      <div class="col-md-4">
        <label class="form-label">Email</label>
        <input [(ngModel)]="editUser.email"
               class="form-control">
      </div>

      <div class="col-md-4">
        <label class="form-label">Mobile</label>
        <input [(ngModel)]="editUser.mobileNumber"
               class="form-control">
      </div>

      <div class="col-md-4">
        <label class="form-label">Role</label>
        <select [(ngModel)]="editUser.role"
                class="form-select">
          <option value="CUSTOMER">Customer</option>
          <option value="STAFF">Staff</option>
        </select>
      </div>

    </div>

    <div class="d-flex gap-2 mt-3">
      <button class="btn btn-warning"
              (click)="submitEdit()">
        Update
      </button>
      <button class="btn btn-outline-secondary"
              (click)="showEdit=false">
        Cancel
      </button>
    </div>
  </div>
</div>

<!-- SEARCH -->
<div class="input-group mb-3" style="max-width:400px">
  <input [(ngModel)]="query"
         class="form-control"
         placeholder="Search by username, email, or name..."
         (keyup.enter)="search()">
  <button class="btn btn-outline-secondary"
          (click)="search()">
    <i class="bi bi-search"></i>
  </button>
</div>

<!-- LOADING -->
<div *ngIf="loading" class="text-center py-5">
  <div class="spinner-border text-primary"></div>
</div>

<!-- TABLE -->
<div class="table-responsive" *ngIf="!loading">
  <table class="table table-hover table-bordered align-middle">
    <thead class="table-dark">
      <tr>
        <th>Username</th>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let u of users">
        <td>{{ u.username }}</td>
        <td>{{ u.customerName }}</td>
        <td>{{ u.email }}</td>
        <td>
          <span class="badge bg-info">
            {{ u.role }}
          </span>
        </td>
        <td>
          <span class="badge"
                [class.bg-success]="u.status==='ACTIVE'"
                [class.bg-secondary]="u.status==='INACTIVE'">
            {{ u.status }}
          </span>
        </td>
        <td>
          <button class="btn btn-sm btn-warning me-1"
                  (click)="openEdit(u)">
            <i class="bi bi-pencil"></i>
          </button>

          <button class="btn btn-sm me-1"
                  [class.btn-danger]="u.status==='ACTIVE'"
                  [class.btn-success]="u.status!=='ACTIVE'"
                  (click)="toggleStatus(u)">
            <i class="bi"
               [class.bi-person-x]="u.status==='ACTIVE'"
               [class.bi-person-check]="u.status!=='ACTIVE'">
            </i>
          </button>

          <button class="btn btn-sm btn-secondary"
                  (click)="resetPassword(u)">
            <i class="bi bi-key"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- PAGINATION -->
<div class="d-flex justify-content-between mt-2"
     *ngIf="totalPages > 1">
  <button class="btn btn-outline-secondary btn-sm"
          (click)="page=page-1; load()"
          [disabled]="page===0">
    Previous
  </button>

  <span>Page {{ page + 1 }} of {{ totalPages }}</span>

  <button class="btn btn-outline-secondary btn-sm"
          (click)="page=page+1; load()"
          [disabled]="page >= totalPages - 1">
    Next
  </button>
</div>
